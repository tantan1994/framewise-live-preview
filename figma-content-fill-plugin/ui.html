<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; color: #161616; background: #fff; font: 12px Inter, "PingFang SC", Arial, sans-serif; }
    .selection { height: 58px; margin-bottom: 12px; padding: 8px 12px; border-radius: 8px; background: #fff4ea; color: #9b8b7d; font-size: 12px; line-height: 18px; }
    .selection.ready { background: #edfaf3; color: #648a74; }
    .selection b { display: block; color: #1f1f1f; margin: 0; font-size: 14px; font-weight: 500; line-height: 20px; }
    .category-row { display: flex; gap: 8px; margin: 0 0 16px; align-items: center; justify-content: space-between; height: 30px; }
    .actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
    .batch { display: inline-flex; align-items: center; height: 26px; border: 0; border-radius: 6px; padding: 0 10px; background: #f5f5f5; color: #161616; font: 500 12px Inter, "PingFang SC", Arial, sans-serif; cursor: pointer; white-space: nowrap; }
    .batch:hover { background: #ededed; }
    .batch:disabled { color: #aaa; cursor: not-allowed; }
    .tabs { display: flex; align-items: center; gap: 8px; height: 34px; margin: 0 0 12px; }
    .tab { height: 34px; min-width: 56px; border: 0; border-radius: 8px; padding: 0 14px; background: transparent; color: #999; font: 500 16px Inter, "PingFang SC", Arial, sans-serif; cursor: pointer; }
    .tab.active { background: #f5f5f5; color: #161616; font-weight: 500; }
    .category-tabs { display: flex; gap: 16px; align-items: center; flex-wrap: nowrap; }
    .category-tabs.hidden { display: none; }
    .category-tab { border: 0; padding: 0; background: transparent; color: #999; font: 400 14px Inter, "PingFang SC", Arial, sans-serif; font-weight: 400; cursor: pointer; white-space: nowrap; }
    .category-tab.active { background: transparent; color: #202020; font-weight: 500; }
    .grid { display: grid; grid-template-columns: repeat(3, 114px); gap: 20px 13px; max-height: calc(100vh - 194px); overflow: auto; padding: 0 0 18px; }
    .card { overflow: hidden; padding: 0; border: 0; border-radius: 7px; background: #fff; text-align: left; cursor: pointer; }
    .card:hover .thumb { box-shadow: inset 0 0 0 2px #18a0fb; }
    .thumb { display: flex; align-items: center; justify-content: center; width: 114px; height: 160px; border-radius: 12px; overflow: hidden; background: #f2f2f2; color: #999; font-size: 10px; }
    .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .card.actor .thumb { width: 56px; height: 56px; margin: 0 auto; border-radius: 50%; aspect-ratio: 1; }
    .card.actor .thumb img { height: 100%; }
    .card span { display: -webkit-box; min-height: 42px; padding: 8px 0 0; color: #1f1f1f; font-size: 12px; font-weight: 500; line-height: 17px; word-break: break-all; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card.actor span { min-height: 25px; padding-top: 8px; text-align: center; font-size: 12px; font-weight: 500; line-height: 17px; -webkit-line-clamp: 1; }
    .empty, .loading { grid-column: 1 / -1; padding: 34px 12px; color: #777; text-align: center; }
    .message { display: none; }
    .message.ok { color: #16834b; }
    .message.error { color: #c63636; }
    .grid.actor-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 20px; }
  </style>
</head>
<body>
  <div id="selection" class="selection"><b>还没有选中图层</b>请选中封面/头像图层和对应名称文本图层。</div>
  <div class="tabs">
    <button class="tab active" data-kind="drama">短剧</button>
    <button class="tab" data-kind="novel">小说</button>
    <button class="tab" data-kind="actor">用户</button>
  </div>
  <div class="category-row">
    <div id="category-tabs" class="category-tabs"></div>
    <div class="actions">
      <button id="batch" class="batch">一键填充</button>
    </div>
  </div>
  <div id="grid" class="grid"><div class="loading">正在启动素材库…</div></div>
  <div id="message" class="message"></div>

  <script>
    var endpoint = 'https://raw.githubusercontent.com/tantan1994/framewise-live-preview/main/shared-library';
    var items = [];
    var kind = 'drama';
    var category = '真人剧';
    var categoryMap = {
      drama: ['真人剧', '漫剧', 'AI仿真人剧'],
      novel: ['男频', '女频'],
      actor: ['真人演员', '虚拟角色', '普通用户']
    };
    var selectionGroups = 0;
    var fallbackItems = [
      ['drama', '真人剧', '夫人一个过肩摔，瘫子总裁站起来了', 'covers/夫人一个过肩摔，瘫子总裁站起来了.jpeg'],
      ['drama', '真人剧', '爱我万岁', 'covers/爱我万岁.jpeg'],
      ['drama', '真人剧', '二嫁上上签', 'covers/二嫁上上签.jpeg'],
      ['drama', '真人剧', '姐，他真是我姐夫', 'covers/姐，他真是我姐夫.jpeg'],
      ['drama', '真人剧', '十八岁太奶奶驾到，重整家族荣耀', 'covers/十八岁太奶奶驾到，重整家族荣耀.jpeg'],
      ['drama', '真人剧', '十八岁太奶奶驾到，重整家族荣耀第二部', 'covers/十八岁太奶奶驾到，重整家族荣耀第二部.jpeg'],
      ['drama', '真人剧', '十八岁太奶奶驾到，重整家族荣耀第三部', 'covers/十八岁太奶奶驾到，重整家族荣耀第三部.jpeg'],
      ['drama', '真人剧', '十八岁太奶奶驾到，重整家族荣耀第四部', 'covers/十八岁太奶奶驾到，重整家族荣耀第四部.jpeg'],
      ['drama', '真人剧', '人间烟火向阳行', 'covers/人间烟火向阳行.jpg'],
      ['actor', '', '韩雨彤', 'actors/韩雨彤.jpeg'],
      ['actor', '', '李柯以', 'actors/李柯以.jpeg'],
      ['actor', '', '梁思伟', 'actors/梁思伟.jpeg'],
      ['actor', '', '王培延', 'actors/王培延.jpeg'],
      ['actor', '', '许顺利', 'actors/许顺利.jpg'],
      ['actor', '', '姚鸣萧', 'actors/姚鸣萧.jpg']
    ].map(function(x) { return { kind: x[0], category: x[1], name: x[2], image: x[3] }; });

    var $ = function(selector) { return document.querySelector(selector); };
    function safe(value) {
      return String(value).replace(/[&<>'"]/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c];
      });
    }

    function message(value, type) {
      var el = $('#message');
      el.textContent = value || '';
      el.className = 'message ' + (type || '');
    }

    function assetUrl(path) {
      var cleanEndpoint = String(endpoint || '').replace(/\/$/, '');
      return cleanEndpoint + '/' + String(path).split('/').map(function(part) {
        return encodeURIComponent(part);
      }).join('/');
    }

    function normalizeKind(value) {
      if (value === 'cover' || value === 'covers' || value === 'drama') return 'drama';
      if (value === 'portrait' || value === 'portraits' || value === 'actor' || value === 'actors') return 'actor';
      if (value === 'book' || value === 'books' || value === 'novel' || value === 'novels') return 'novel';
      return value;
    }

    function normalizeItems(data) {
      if (data && Array.isArray(data.items) && data.items.length) return data.items;
      if (Array.isArray(data) && data.length) return data;
      return fallbackItems;
    }

    function hydrate(source) {
      return source.filter(function(item) {
        return item && item.kind && item.name && item.image;
      }).map(function(item) {
        return {
          kind: normalizeKind(item.kind),
          category: item.category || (normalizeKind(item.kind) === 'drama' ? '真人剧' : (normalizeKind(item.kind) === 'novel' ? '男频' : '真人演员')),
          name: item.name,
          image: item.image,
          url: assetUrl(item.image),
          thumbUrl: '',
          bytes: null,
          failed: false
        };
      });
    }

    function filteredItems() {
      return items.filter(function(item) {
        if (item.kind !== kind) return false;
        if (item.category !== category) return false;
        return true;
      });
    }

    function renderCategoryTabs() {
      var wrap = $('#category-tabs');
      wrap.innerHTML = '';
      $('#batch').textContent = '一键填充';
      wrap.className = 'category-tabs';
      (categoryMap[kind] || []).forEach(function(value) {
        var button = document.createElement('button');
        button.className = 'category-tab' + (value === category ? ' active' : '');
        button.textContent = value;
        button.onclick = function() {
          category = value;
          renderCategoryTabs();
          render();
        };
        wrap.appendChild(button);
      });
    }

    function render() {
      var shown = filteredItems();
      var grid = $('#grid');
      grid.className = 'grid' + (kind === 'actor' ? ' actor-grid' : '');
      grid.innerHTML = '';
      if (!shown.length) {
        grid.innerHTML = '<div class="empty">没有找到匹配素材</div>';
        return;
      }
      shown.forEach(function(item) {
        var button = document.createElement('button');
        button.className = 'card ' + (item.kind === 'actor' ? 'actor' : 'cover');
        var thumb = item.thumbUrl
          ? '<div class="thumb"><img src="' + safe(item.thumbUrl) + '" alt=""></div>'
          : '<div class="thumb">' + (item.failed ? '图片读取失败' : '加载中…') + '</div>';
        button.innerHTML = thumb + '<span>' + safe(item.name) + '</span>';
        button.onclick = function() { apply(item); };
        grid.appendChild(button);
      });
    }

    async function loadImageIntoItem(item) {
      if (item.bytes) return;
      if (item.loadingPromise) return item.loadingPromise;
      item.loadingPromise = (async function() {
        try {
          var response = await fetch(item.url);
          if (!response.ok) throw new Error('图片读取失败');
          var buffer = await response.arrayBuffer();
          item.bytes = Array.prototype.slice.call(new Uint8Array(buffer));
          item.thumbUrl = URL.createObjectURL(new Blob([buffer]));
        } catch (error) {
          item.failed = true;
        } finally {
          item.loadingPromise = null;
        }
      })();
      await item.loadingPromise;
      render();
    }

    function loadImages() {
      var queue = items.slice();
      var workers = [0, 1, 2].map(function() {
        return (async function() {
        while (queue.length) {
          await loadImageIntoItem(queue.shift());
        }
        })();
      });
      Promise.all(workers).then(function() {
        var loaded = items.filter(function(item) { return item.bytes; }).length;
        if (loaded) message('已加载 ' + loaded + ' 张共享图片。', 'ok');
        else message('图片没有加载成功，请检查素材库地址或 GitHub 文件是否公开。', 'error');
      });
    }

    async function load() {
      try {
        items = hydrate(fallbackItems);
        render();
        message('已显示内置素材，正在同步共享素材库…', 'ok');
        var response = await fetch(endpoint + '/catalog.json');
        if (!response.ok) throw new Error('素材库暂不可用');
        var data = await response.json();
        if (Array.isArray(data.categories) && data.categories.length) categoryMap.drama = data.categories;
        var remoteItems = hydrate(normalizeItems(data));
        items = remoteItems.length ? remoteItems : hydrate(fallbackItems);
        renderCategoryTabs();
        render();
        message('已同步 ' + items.length + ' 条共享素材，正在加载图片…', 'ok');
      } catch (error) {
        items = hydrate(fallbackItems);
        renderCategoryTabs();
        render();
        message('已显示内置素材；在线目录稍后可重试。', 'ok');
      }
      loadImages();
    }

    async function apply(item) {
      try {
        message('正在填充「' + item.name + '」…');
        if (!item.bytes) await loadImageIntoItem(item);
        if (!item.bytes) throw new Error('图片读取失败');
        parent.postMessage({ pluginMessage: { type: 'apply-shared', name: item.name, bytes: item.bytes } }, '*');
      } catch (error) {
        message('图片读取失败，请稍后重试。', 'error');
      }
    }

    function shuffle(source) {
      var copy = source.slice();
      for (var i = copy.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = copy[i];
        copy[i] = copy[j];
        copy[j] = tmp;
      }
      return copy;
    }

    async function batchApply() {
      try {
        var available = filteredItems().filter(function(item) { return !item.failed; });
        if (!available.length) {
          message('当前分类没有可用素材。', 'error');
          return;
        }
        if (!selectionGroups) {
          message('请先选中一个包含多组「图片 + 标题」的模块。', 'error');
          return;
        }
        var count = Math.min(selectionGroups, available.length);
        var picks = shuffle(available).slice(0, count);
        $('#batch').disabled = true;
        message('正在从「' + (kind === 'drama' ? category : (kind === 'novel' ? '小说' : '演员')) + '」随机填充 ' + count + ' 组…');
        for (var i = 0; i < picks.length; i++) {
          if (!picks[i].bytes) await loadImageIntoItem(picks[i]);
        }
        picks = picks.filter(function(item) { return item.bytes; });
        if (!picks.length) throw new Error('图片读取失败');
        parent.postMessage({
          pluginMessage: {
            type: 'apply-batch-shared',
            items: picks.map(function(item) { return { name: item.name, bytes: item.bytes }; })
          }
        }, '*');
      } catch (error) {
        message('一键填充失败，请稍后重试。', 'error');
      } finally {
        $('#batch').disabled = false;
      }
    }

    document.querySelectorAll('.tab').forEach(function(tab) {
      tab.onclick = function() {
        document.querySelectorAll('.tab').forEach(function(x) { x.classList.remove('active'); });
        tab.classList.add('active');
        kind = tab.dataset.kind;
        category = (categoryMap[kind] || [''])[0];
        renderCategoryTabs();
        render();
      };
    });
    $('#batch').onclick = batchApply;
    onmessage = function(event) {
      var m = event.data.pluginMessage;
      if (!m) return;
      if (m.type === 'selection') {
        selectionGroups = m.groups || 0;
        $('#selection').className = 'selection' + (m.total ? ' ready' : '');
        $('#selection').innerHTML = m.total
          ? '<b>已选中 ' + m.total + ' 个图层</b>可单个填充：' + m.fillable + ' 图 + ' + m.texts + ' 文；可一键填充：' + selectionGroups + ' 组。'
          : '<b>还没有选中图层</b>请选中封面/头像图层和对应名称文本图层。';
      }
      if (m.type === 'success') message(m.message, 'ok');
      if (m.type === 'error') message(m.message, 'error');
    };
    renderCategoryTabs();
    load();
  </script>
</body>
</html>
